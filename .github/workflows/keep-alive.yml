name: Keep Render Alive

on:
  schedule:
    # هر 5 دقیقه اجرا می‌شود (Render هر 15 دقیقه می‌خوابد)
    - cron: '*/5 * * * *'
  # امکان اجرای دستی هم وجود دارد
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          echo "🔔 در حال ارسال درخواست به Render..."
          curl -X GET "https://bot-1rcn.onrender.com/health" \
               -H "Accept: application/json" \
               --max-time 30
          
          if [ $? -eq 0 ]; then
            echo "✅ سرور بیدار ماند!"
          else
            echo "❌ خطا در اتصال به سرور"
            exit 1
          fi
